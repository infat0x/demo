settings:
  content:
    merge: true

media:
  input: assets/img
  output: /assets/img
  extensions: [jpg, jpeg, png, webp, gif, svg, avif, ico]
  rename: false

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    exclude: [".placeholder", ".gitkeep"]
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, date, published, categories]
      sort: [date, title]
      search: [title, description, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: body
        label: Article
        type: rich-text
        options:
          format: markdown
          switcher: true

      - name: description
        label: Summary
        type: text
        description: "A short description for the homepage and search previews."

      - name: image
        label: Cover Image
        type: image
        description: "Recommended size: 1200 x 630 pixels."

      - name: categories
        label: Categories
        type: string
        list:
          max: 2
        description: "Add the main category first, then an optional subcategory."

      - name: tags
        label: Tags
        type: string
        list: true
        description: "Add one lowercase tag per item."

      - name: date
        label: Publication Date
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xx"
        description: "Leave blank to use the date in the filename."

      - name: author
        label: Author ID
        type: string
        description: "Use an ID from Authors, or leave blank for the site default."

      - name: published
        label: Published
        type: boolean
        default: true
        description: "Turn off to hide the post from the site. Its source remains visible in a public repository."

      - name: pin
        label: Pin to Home
        type: boolean
        default: false

      - name: toc
        label: Table of Contents
        type: boolean
        default: true

      - name: comments
        label: Enable Comments
        type: boolean
        default: true
        description: "Requires a comment provider configured in Chirpy."

      - name: math
        label: Enable Math
        type: boolean
        default: false

      - name: mermaid
        label: Enable Mermaid
        type: boolean
        default: false

  - name: pages
    label: Pages
    type: group
    items:
      - name: about
        label: About
        type: file
        path: _tabs/about.md
        format: yaml-frontmatter
        operations:
          delete: false
        fields:
          - name: title
            label: Page Title
            type: string
            description: "Leave blank to use Chirpy's default title."

          - name: icon
            label: Sidebar Icon
            type: string
            description: "For example, fas fa-info-circle."

          - name: order
            label: Sidebar Order
            type: number

          - name: body
            label: About Page
            type: rich-text
            options:
              format: markdown
              switcher: true

      - name: navigation
        label: Navigation Pages
        type: collection
        path: _tabs
        format: yaml-frontmatter
        exclude: [about.md]
        subfolders: false
        filename:
          template: "{primary}.md"
          field: create
        operations:
          rename: false
          delete: false
        view:
          primary: title
        fields:
          - name: title
            label: Page Title
            type: string

          - name: icon
            label: Sidebar Icon
            type: string
            description: "For example, fas fa-folder."

          - name: order
            label: Sidebar Order
            type: number

          - name: body
            label: Page Content
            type: rich-text
            options:
              format: markdown
              switcher: true

  - name: site-admin
    label: Site Administration
    type: group
    items:
      - name: site
        label: Site Settings
        type: file
        path: _config.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            label: Site Name
            type: string
            required: true

          - name: tagline
            label: Tagline
            type: string

          - name: description
            label: Site Description
            type: text

          - name: avatar
            label: Profile Picture
            type: image

          - name: social_preview_image
            label: Default Social Preview Image
            type: image

          - name: theme_mode
            label: Default Color Mode
            type: select
            options:
              values:
                - name: light
                  label: Light
                - name: dark
                  label: Dark
            description: "Leave empty to follow the visitor's system setting."

          - name: timezone
            label: Time Zone
            type: string
            description: "For example, Asia/Baku."

          - name: paginate
            label: Posts Per Page
            type: number
            description: "Use a positive whole number, such as 10."

      - name: authors
        label: Authors
        type: file
        path: _data/authors.yml
        format: raw
        operations:
          delete: false

      - name: contact
        label: Sidebar Contact Links
        type: file
        path: _data/contact.yml
        format: raw
        operations:
          delete: false

      - name: sharing
        label: Post Sharing Buttons
        type: file
        path: _data/share.yml
        format: raw
        operations:
          delete: false

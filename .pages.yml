media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Cover Image
        type: image
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text

  - name: about
    label: About
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    fields:
      - name: icon
        label: Icon
        type: string
        hidden: true
      - name: order
        label: Menu Order
        type: number
        hidden: true
      - name: body
        label: Body
        type: rich-text

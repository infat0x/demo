settings:
  content:
    merge: true

media:
  input: assets/img
  output: /assets/img
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    subfolders: false
    exclude:
      - .placeholder
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    operations:
      rename: false
    view:
      primary: title
      fields: [title, date, published, categories]
      sort: [date, title]
      search: [title, description, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Summary
        type: text

      - name: image
        label: Cover Image
        type: image

      - name: categories
        label: Categories
        type: string
        list:
          max: 2
        description: "Add a main category and, optionally, a subcategory."

      - name: tags
        label: Tags
        type: string
        list: true
        description: "Add one lowercase tag per item."

      - name: date
        label: Publication Date
        type: date
        default: ""
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss xx"
        description: "Leave blank to use the date in the filename."

      - name: author
        label: Author ID
        type: string
        description: "Use an ID from _data/authors.yml, or leave blank for the default author."

      - name: published
        label: Published
        type: boolean
        default: true
        description: "Turn off to hide this post from the site. Its source is still visible in a public repository."

      - name: pin
        label: Pin to Home
        type: boolean
        default: false

      - name: toc
        label: Table of Contents
        type: boolean
        default: true

      - name: comments
        label: Enable Comments
        type: boolean
        default: true

      - name: math
        label: Enable Math
        type: boolean
        default: false

      - name: mermaid
        label: Enable Mermaid
        type: boolean
        default: false

      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: about
    label: About
    type: file
    path: _tabs/about.md
    format: yaml-frontmatter
    fields:
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: site
    label: Site Settings
    type: file
    path: _config.yml
    format: yaml
    fields:
      - name: title
        label: Site Name
        type: string
        required: true

      - name: tagline
        label: Tagline
        type: string

      - name: description
        label: Site Description
        type: text

      - name: avatar
        label: Profile Picture
        type: image

      - name: social_preview_image
        label: Default Social Preview Image
        type: image

  - name: contact
    label: Sidebar Contact Links
    type: file
    path: _data/contact.yml
    format: raw

  - name: sharing
    label: Post Sharing Buttons
    type: file
    path: _data/share.yml
    format: raw

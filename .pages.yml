media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: Yazılar
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    fields:
      - name: title
        label: Başlıq
        type: string
        required: true
      - name: body
        label: Mətn
        type: rich-text

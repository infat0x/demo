media:
  input: assets/img
  output: /assets/img

content:
  - name: posts
    label: Posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Cover Image
        type: image
      - name: body
        label: Body
        type: rich-text
